name: Build PDF and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
          mkdir -p ~/.config/fontconfig/conf.d
          cat > ~/.config/fontconfig/conf.d/99-typst-fonts.conf <<'EOF'
          <fontconfig>
            <alias>
              <family>Source Han Sans SC</family>
              <prefer>
                <family>Noto Sans CJK SC</family>
              </prefer>
            </alias>
            <alias>
              <family>Microsoft YaHei</family>
              <prefer>
                <family>Noto Sans CJK SC</family>
              </prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f

      - name: Compile PDF
        run: typst compile main.typ main.pdf

      - name: Create tag
        run: |
          tag="build-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "release_tag=$tag" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          files: main.pdf
