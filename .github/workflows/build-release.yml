name: Build PDF and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Set build version
        run: |
          build_time="$(date -u +'%Y%m%d-%H%M%S')"
          tag="build-${build_time}-${GITHUB_RUN_NUMBER}"
          pdf_name="flight-controller-manual-${build_time}.pdf"
          html_name="flight-controller-manual-${build_time}.html"
          echo "build_time=${build_time}" >> "$GITHUB_ENV"
          echo "release_tag=${tag}" >> "$GITHUB_ENV"
          echo "pdf_name=${pdf_name}" >> "$GITHUB_ENV"
          echo "html_name=${html_name}" >> "$GITHUB_ENV"

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core

      - name: Compile PDF
        run: typst compile main.typ "${{ env.pdf_name }}"

      - name: Compile HTML
        run: typst compile --features html --format html main.typ "${{ env.html_name }}"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.release_tag }}"
          git push origin "${{ env.release_tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          files: |
            ${{ env.pdf_name }}
            ${{ env.html_name }}
